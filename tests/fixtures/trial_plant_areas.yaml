# The trial kit's area plant file (docs/examples/trial/plant-areas.yaml) in format 2.
hydronicus: 2
name: Trial plant
pumps:
  circulation_pump:
    switch: switch.hydronicus_trial_pump
zones:
  living_room:
    areas: [living_room]
    loops:
      floor:
        valves: [switch.hydronicus_trial_living_room_valve]
        pump: circulation_pump
  bedroom:
    areas: [bedroom]
    loops:
      floor:
        valves: [switch.hydronicus_trial_bedroom_valve]
        pump: circulation_pump
