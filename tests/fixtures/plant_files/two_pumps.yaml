hydronicus: 1
name: Two floors
pumps:
  ground_pump:
    entity_id: switch.ground_pump
    overrun_seconds: 60
  upper_pump:
    entity_id: switch.upper_pump
    power_feedback_entity: sensor.upper_pump_power
rooms:
  kitchen:
    temperature_sensors: [sensor.kitchen_temperature]
    loops:
      kitchen_loop:
        valves: [switch.kitchen_valve]
        pump: ground_pump
  attic:
    temperature_sensors: [sensor.attic_temperature]
    loops:
      attic_loop:
        valves: [switch.attic_valve]
        pump: upper_pump
