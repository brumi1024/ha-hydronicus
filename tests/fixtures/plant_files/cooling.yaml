hydronicus: 1
name: Cooling
pumps:
  pump: switch.pump
rooms:
  living_room:
    thermostat:
      initial_target_temperature: 22
      cooling_start_delta: 0.5
    temperature_sensors:
      - entity_id: sensor.living_temperature
        weight: 2
      - sensor.living_temperature_2
    humidity_sensors: [sensor.living_humidity]
    loops:
      living_loop:
        valves: [switch.living_valve]
        pump: pump
        cooling_enabled: true
        supply_temperature_sensor: sensor.living_supply
        condensation_margin: 3
