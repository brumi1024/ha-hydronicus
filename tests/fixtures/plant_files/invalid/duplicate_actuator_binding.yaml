# The second binding of switch.shared is the bedroom loop's shorthand valve.
hydronicus: 1
name: Duplicate actuator binding
pumps:
  pump: switch.pump
zones:
  living_room:
    temperature_sensors: [sensor.living_temperature]
    loops:
      living_loop:
        valves: [switch.shared]
        pump: pump
  bedroom:
    temperature_sensors: [sensor.bedroom_temperature]
    loops:
      bedroom_loop:
        valves: [switch.shared]
        pump: pump
