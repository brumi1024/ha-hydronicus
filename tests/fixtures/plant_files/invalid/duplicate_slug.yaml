# Valve slugs share one namespace across the Plant and every room.
hydronicus: 1
name: Duplicate slug
pumps:
  pump: switch.pump
valves:
  bedroom_valve: switch.hall_valve
rooms:
  bedroom:
    temperature_sensors: [sensor.bedroom_temperature]
    valves:
      bedroom_valve: switch.bedroom_valve
    loops:
      bedroom_loop:
        valves: [bedroom_valve]
        pump: pump
