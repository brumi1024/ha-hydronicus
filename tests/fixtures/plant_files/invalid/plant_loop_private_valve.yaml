hydronicus: 1
name: Plant loop using a private valve
pumps:
  pump: switch.pump
loops:
  hall_loop:
    valves: [switch.hall_valve, living_valve]
    pump: pump
zones:
  living_room:
    temperature_sensors: [sensor.living_temperature]
    valves:
      living_valve: switch.living_valve
    loops:
      living_loop:
        valves: [living_valve]
        pump: pump
    shared_loops: [hall_loop]
