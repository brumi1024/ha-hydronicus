# Hydronicus reference plant: an air-to-water heat pump that heats and cools,
# a hydraulic separator, three zones over Home Assistant areas, a ceiling loop
# in every zone, an underfloor loop with its own pump, and a towel dryer that
# runs whenever the heat pump heats.
# docs/plant-file.md explains every key. The entity IDs are examples; replace
# them with your own before you import the file.
hydronicus: 2
id: 7c9e6679-7425-40de-944b-e07fc1f90ae7   # optional; keeps the entity IDs on a new import
name: Home
mode_dwell: 3600
source:
  name: Heat pump
  strategy: request
  request: switch.heat_pump_heat_request
  mode: {entity: select.heat_pump_mode, heat: Heat, cool: Cool}
  post_run: 180
  min_on: 600
  min_off: 600
pumps:
  heat_pump:
    driven_by: source                      # the heat pump's own circulator
    min_flow: path                         # guaranteed when the separator protects it
    min_flow_loops: [living_area.ceiling]  # held open while it may run and no zone calls
    supply_temperature: sensor.ceiling_supply_temperature   # lets the ceiling loops cool
  floor:
    switch: switch.home_underfloor_heating_pump
    overrun: 180
  towel_dryer:
    switch: switch.home_bathrooms_towel_dryer_pump
    overrun: 120
loops:
  towel_dryer:                             # a plant loop with a pump and no valve
    pump: towel_dryer
    runs: with_source
    modes: [heat]
zones:
  basement:
    areas: [basement, workshop]
    thermostat: {digital: {presets: {comfort: 21, eco: 19, away: 16}}}
    loops:
      ceiling:
        valves: [switch.home_basement_ceiling_heating_valve]
        pump: heat_pump
        modes: [heat, cool]
  bedroom_area:
    areas: [main_bedroom, lilla_bedroom]
    loops:
      ceiling:
        valves: [switch.home_bedroom_area_ceiling_heating_valve]
        pump: heat_pump
        modes: [heat, cool]
  living_area:
    areas: [living_room, dining_room, kitchen, hallway]
    loops:
      ceiling:
        valves: [switch.home_living_area_ceiling_heating_valve]
        pump: heat_pump
        modes: [heat, cool]
      floor:
        valves: [switch.home_living_area_floor_heating_valve]
        pump: floor
        modes: [heat]
